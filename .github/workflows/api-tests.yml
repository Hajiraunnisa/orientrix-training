name: Postman API Tests
on: [push]
     
       
  test-api:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install Newman
        run: npm install -g newman
        
      - name: Run Postman Tests
        run: newman run .github/workflows/collection.json -d .github/workflows/data.csv --delay-request 500

